plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.acazen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.CosmianGroupLtd.Acazen'
        minSdk 26
        targetSdk 36
        versionCode 11
        versionName '2.10.0'

        // "Hey Acazen" wake word (Porcupine). Read from the environment at build time so the
        // key is never committed to source. Falls back to an empty string so debug builds that
        // don't touch the wake-word feature still compile; WakeWordService checks for a blank
        // key at runtime and disables itself with a clear log message instead of crashing.
        def porcupineKey = System.getenv("PORCUPINE_KEY") ?: ""
        buildConfigField "String", "PORCUPINE_ACCESS_KEY", "\"${porcupineKey}\""
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("ACAZEN_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("ACAZEN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ACAZEN_KEY_ALIAS")
                keyPassword System.getenv("ACAZEN_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.airbnb.android:lottie:6.6.2'

    // "Hey Acazen" wake word detection (on-device, offline).
    // Pinned to a version confirmed present on Maven Central (see
    // https://central.sonatype.com/artifact/ai.picovoice/porcupine-android) — the previous
    // 3.0.5 pin didn't actually exist there and failed dependency resolution in CI.
    implementation 'ai.picovoice:porcupine-android:4.0.2'
}
