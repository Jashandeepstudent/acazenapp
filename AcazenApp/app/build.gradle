plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.acazen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.CosmianGroupLtd.Acazen'
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName '2.13.1'
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("ACAZEN_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("ACAZEN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ACAZEN_KEY_ALIAS")
                keyPassword System.getenv("ACAZEN_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.airbnb.android:lottie:6.6.2'

    // The "Hey Acazen" Vosk wake word was REMOVED in 2.12.0 — the ~40MB Vosk model, vosk-android
    // and JNA are gone from the bundle entirely. Voice launch (2.13.0+) happens by Acazen
    // registering as the device's Assistant app (RoleManager.ROLE_ASSISTANT) so the system's own
    // hold-Power gesture opens it — see AcazenInteractionService. Needs no extra library: it's
    // built on android.service.voice.* (SDK) + Android's built-in SpeechRecognizer, same as the
    // rehearsal overlay (VoiceCommandActivity) already used. RoleManager itself needs API 29+
    // (minSdk here is 26); every call site checks Build.VERSION.SDK_INT first and the feature
    // simply isn't offered below that, same as it never worked via the old approach either.
}
