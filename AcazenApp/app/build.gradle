plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.acazen.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.CosmianGroupLtd.Acazen'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '2.9.2'
    }
    signingConfigs {
        release {
            def ksPath = System.getenv("ACAZEN_KEYSTORE_PATH")
            if (ksPath != null) {
                storeFile file(ksPath)
                storePassword System.getenv("ACAZEN_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ACAZEN_KEY_ALIAS")
                keyPassword System.getenv("ACAZEN_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.airbnb.android:lottie:6.6.2'
}
